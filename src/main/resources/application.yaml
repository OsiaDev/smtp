server:
  port: ${PORT:8080}

spring:
  application:
    name: umas-smtp-service

  # R2DBC Configuration
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:umas_db}
    username: ${DB_USER:umas_user}
    password: ${DB_PASS:umas_pass}
    pool:
      initial-size: 10
      max-size: 20
      max-idle-time: 30m

  kafka:
    consumer:
      bootstrap-servers: ${KAFKA_BROKERS:localhost:29092}
      group-id: umas-smtp-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "co.cetad.umas.smtp.domain.model.dto"

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  # Thymeleaf Configuration
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html

# UMAS SMTP Configuration
umas:
  smtp:
    kafka:
      topics:
        dron-preparation: umas.dron.preparation.notification

    templates:
      dron-preparation:
        subject: "Preparación de Dron Requerida - {missionName}"
        template-name: dron_preparation_notification

    email:
      retry:
        max-attempts: 3
        delay-seconds: 30
      from:
        address: ${GMAIL_USERNAME}
        name: UMAS Notification System

# ===== MANAGEMENT / ACTUATOR =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false  # Desactivar health check de mail para evitar timeouts

# Logging Configuration
logging:
  level:
    root: INFO
    co.cetad.umas.smtp: DEBUG
    org.springframework.kafka: INFO
    org.springframework.r2dbc: DEBUG
    io.r2dbc.postgresql.QUERY: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"